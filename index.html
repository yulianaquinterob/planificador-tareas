<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Planner</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.2/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="./static/css/style.css">
</head>
<body>

    <nav class="navbar navbar-expand-lg navbar-light bg-white border-bottom shadow-sm px-4">
        <div class="container-fluid">
           <a class="navbar-brand" href="/index.html">Planner</a>
        </div>
    </nav>

    <main class="container mt-4">
        
        <section class="d-flex flex-column flex-md-row justify-content-between align-items-md-center mb-4 gap-3">
            <div>
                <h1 class="fw-bold  mb-1" >Hola, yuliana</h1>
                <p class="text-muted mb-0">Organiza tu trabajo, mueve cada tarea y mantén el ritmo de tu día.</p>
            </div>
            <div>
                <button type="button" class="btn  text-white fw-bold px-4 py-2 shadow-sm" id="btn-open-modal">
                    + Nueva tarea
                </button>

                <button id="calendar-drawer" class="btn text-white fw-bold px-4 py-2 shadow-sm" type="button" data-bs-toggle="offcanvas" data-bs-target="#offcanvasRight" aria-controls="offcanvasRight">
                    Calendario
                </button>
            </div>
            
            <div class="offcanvas offcanvas-end calendar-offcanvas" tabindex="-1" id="offcanvasRight" aria-labelledby="offcanvasRightLabel">
                <div class="offcanvas-header">
                    <h5 class="offcanvas-title" id="offcanvasRightLabel">Calendario</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="offcanvas" aria-label="Close"></button>
                </div>
                <iframe class="calendar-frame" src="/calendar.html" title="Calendario y Eventos"></iframe>
            </div>

            <div class="modal fade" id="taskModal" tabindex="-1" aria-labelledby="taskModalLabel" aria-hidden="true">
                <div class="modal-dialog modal-dialog-centered">
                    <div class="modal-content">
                        <div class="modal-header">
                            <h5 class="modal-title" id="taskModalLabel">Nueva Tarea</h5>
                            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                        </div>
                        <div class="modal-body">
                            <form id="form" novalidate>
                                <div class="mb-3">
                                    <label for="title" class="form-label">Título</label>
                                    <input type="text" class="form-control" id="title" name="title" minlength="8" maxlength="20" required placeholder="Preparar la presentación">
                                    <div class="error-message" id="title-error" aria-live="polite"></div>
                                </div>
                                
                                <div class="mb-3">
                                    <label for="person" class="form-label">Persona asignada</label>
                                    <input type="text" class="form-control" id="person" name="person" minlength="8" maxlength="20" required placeholder="María">
                                    <div class="error-message" id="person-error" aria-live="polite"></div>
                                </div>

                                <div class="mb-3">
                                    <label for="description" class="form-label">Descripción</label>
                                    <textarea class="form-control" id="description" name="description" minlength="15" maxlength="60" required placeholder="Añade contexto para completar la tarea"></textarea>
                                    <div class="error-message" id="description-error" aria-live="polite"></div>
                                </div>

                                <div class="row g-3">
                                    <div class="col">
                                        <label for="date" class="form-label">Fecha de Entrega</label>
                                        <input type="date" class="form-control" id="date" name="date" required>
                                        <div class="error-message" id="date-error" aria-live="polite"></div>
                                    </div>
                                    <div class="col">
                                        <label for="state" class="form-label">Estado</label>
                                        <select class="form-select" id="state" name="state" required>
                                            <option value="" selected disabled>Selecciona un estado</option>
                                            <option value="to-do">POR HACER</option>
                                            <option value="process">EN PROCESO</option>
                                            <option value="revision">REVISIÓN</option>
                                            <option value="hecho">HECHO</option>
                                        </select>
                                        <div class="error-message" id="state-error" aria-live="polite"></div>
                                    </div>
                                </div>
                                <div class="d-flex gap-2 justify-content-end">
                                    <button type="button" id="btn-cancel" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                                    <button type="submit" class="btn btn-primary">Guardar Tarea</button>
                                </div>
                                <p id="form-status" role="status" aria-live="polite" class="mt-2 text-center"></p>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </section>

        <section id="dashboard-view" class="view">
            <div class="row g-4">
                <div class="col-md-3">
                    <div class="task-column p-3 rounded bg-light border" id="column-to-do">
                        <h3 class="h6  fw-bold border-bottom pb-2"> <span style="color: #f72585">●</span> Por hacer <span class="badge text-secondary-emphasis">0</span></h3>
                        <div class="tasks-list"></div>
                    </div>
                </div>
                <div class="col-md-3">
                    <div class="task-column p-3 rounded bg-light border" id="column-process">
                        <h3 class="h6  fw-bold border-bottom pb-2"><span style="color: #4361ee">●</span> En proceso <span class="badge text-secondary-emphasis">0</span></h3>
                        
                        <div class="tasks-list"></div>
                    </div>
                </div>
                <div class="col-md-3">
                    <div class="task-column p-3 rounded bg-light border" id="column-revision">
                        <h3 class="h6  fw-bold border-bottom pb-2"><span style="color: #7209b7">●</span> En revisión <span class="badge text-secondary-emphasis ">0</span></h3>
                        <div class="tasks-list"></div>
                    </div>
                </div>
 
                <div class="col-md-3">
                    <div class="task-column p-3 rounded bg-light border" id="column-hecho">
                        <h3 class="h6  fw-bold border-bottom pb-2"><span style="color: #4cc9f0">●</span> Hecho <span class="badge text-secondary-emphasis ">0</span></h3>
                        <div class="tasks-list"></div>
                    </div>
                </div>
            </div>
        </section>


    </main>

    <template id="task-card-template">
        <article class="task-card card mb-3 shadow-sm p-3">
            <div class="d-flex justify-content-between align-items-start mb-2">
                <h4 class="card-title h6 fw-bold mb-0"></h4>
               
            </div>

            <div class="card-footer bg-transparent p-0 pt-2 border-top small text-secondary d-flex flex-column gap-1 mb-2">
                <span><strong>Responsable:</strong> <span class="card-person"></span></span>
                <span><strong>Descripción:</strong> <span class="card-description"></span></span>
                <span><strong>Entrega:</strong> <span class="card-date"></span></span>
            </div>
            <button class="btn btn-danger btn-sm btn-delete">Eliminar</button>   
        </article>
    </template>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
    <script src="./static/js/script.js"></script>
</body>
</html>
