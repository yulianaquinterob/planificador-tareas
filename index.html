<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plannner</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="./css/style.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm">
        <div class="container-fluid">
            <a class="navbar-brand fw-bold" href="#" >Planner </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse justify-content-end" id="navbarNav">
                <ul class="navbar-nav">
                    <li class="nav-item">
                        <a class="nav-link active" href="#" id="nav-inicio">Tablero</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#" id="nav-agregar">Agregar Tarea</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <main class="container my-4">

        <section id="dashboard-view" class="view">
            <h2 class="text-center mb-4 ">TABLERO DE TAREAS</h2>
            <div class="row g-4">
                <div class="col-md-3">
                    <div class="task-column p-3 rounded bg-light border" id="column-to-do">
                        <h3 class="h6 text-warning fw-bold border-bottom pb-2">POR HACER</h3>
                        <div class="tasks-list"></div>
                    </div>
                </div>
                <div class="col-md-3">
                    <div class="task-column p-3 rounded bg-light border" id="column-process">
                        <h3 class="h6 text-primary fw-bold border-bottom pb-2">EN PROCESO</h3>
                        <div class="tasks-list"></div>
                    </div>
                </div>
                <div class="col-md-3">
                    <div class="task-column p-3 rounded bg-light border" id="column-revision">
                        <h3 class="h6 text-info fw-bold border-bottom pb-2">REVISIÓN</h3>
                        <div class="tasks-list"></div>
                    </div>
                </div>
 
                <div class="col-md-3">
                    <div class="task-column p-3 rounded bg-light border" id="column-hecho">
                        <h3 class="h6 text-success fw-bold border-bottom pb-2">HECHO</h3>
                        <div class="tasks-list"></div>
                    </div>
                </div>
            </div>
        </section>

        <section id="form-view" class="view hidden row justify-content-center">
            <div class="col-md-8 col-lg-6 bg-white p-4 rounded shadow-sm border">
                <h2 class="text-center mb-3">Crear Nueva Tarea</h2>
                <form id="form" novalidate>
                    <div class="mb-3">
                        <label for="title" class="form-label">Nombre</label>
                        <input type="text" class="form-control" id="title" name="title" maxlength="20" required placeholder="Mínimo 5 caracteres">
                        <div class="error-message" id="title-error" aria-live="polite"></div>
                    </div>
                    <div class="mb-3">
                        <label for="description" class="form-label">Descripción</label>
                        <textarea class="form-control" id="description" name="description" maxlength="60" required placeholder="Mínimo 10 caracteres"></textarea>
                        <div class="error-message" id="description-error" aria-live="polite"></div>
                    </div>
                    <div class="mb-3">
                        <label for="person" class="form-label">Responsable</label>
                        <input type="text" class="form-control" id="person" name="person" maxlength="25" required placeholder="Mínimo 3 caracteres">
                        <div class="error-message" id="person-error" aria-live="polite"></div>
                    </div>
                    <div class="mb-3">
                        <label for="date" class="form-label">Fecha de Entrega</label>
                        <input type="date" class="form-control" id="date" name="date" required>
                        <div class="error-message" id="date-error" aria-live="polite"></div>
                    </div>
                    <div class="mb-3">
                        <label for="state" class="form-label">Estado</label>
                        <select class="form-select" id="state" name="state" required>
                            <option value="" selected disabled>Selecciona un estado</option>
                            <option value="to-do">POR HACER</option>
                            <option value="process">EN PROCESO</option>
                            <option value="revision">REVISIÓN</option>
                            <option value="hecho">HECHO</option>
                        </select>
                        <div class="error-message" id="state-error" aria-live="polite"></div>
                    </div>
                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-primary w-100">Agregar Tarea</button>
                        <button type="button" id="btn-cancel" class="btn btn-secondary w-100">Cancelar</button>
                    </div>
                    <p id="form-status" role="status" aria-live="polite" class="mt-2 text-center"></p>
                </form>
            </div>
        </section>

    </main>

    <template id="task-card-template">
        <article class="task-card card mb-3 shadow-sm p-3">
            <div class="d-flex justify-content-between align-items-start mb-2">
                <h4 class="card-title h6 fw-bold mb-0"></h4>
               
            </div>
            <p class="card-description small text-muted mb-2"></p>
            <div class="card-footer bg-transparent p-0 pt-2 border-top small text-secondary d-flex flex-column gap-1 mb-2">
                <span><strong>Responsable:</strong> <span class="card-person"></span></span>
                <span><strong>Entrega:</strong> <span class="card-date"></span></span>
            </div>
            <button class="btn btn-danger btn-sm btn-delete">Eliminar</button>   
        </article>
    </template>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOwhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
    <script src="./js/script.js"></script>
</body>
</html>
