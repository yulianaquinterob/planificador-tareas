<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>calendar</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.2/font/bootstrap-icons.min.css">
    <link href='https://cdn.jsdelivr.net/npm/fullcalendar@7.1.3/skeleton.css' rel='stylesheet' />
    <link href='https://cdn.jsdelivr.net/npm/fullcalendar@7.1.3/themes/monarch/theme.css' rel='stylesheet' />
    <link href='https://cdn.jsdelivr.net/npm/fullcalendar@7.1.3/themes/monarch/palettes/purple.css' rel='stylesheet' />
    <link rel="stylesheet" href="./static/css/calendar.css">
    <link rel="stylesheet" href="./static/css/style.css">
</head>
<body>
    <main>
            <!-- Contenedor donde FullCalendar renderizará el diseño interactivo -->
        <div class="bg-white p-3 rounded-4 shadow-sm mb-4">
            <div id="calendar"></div>
        </div>

        <!-- Sección 2: Card de Fecha Seleccionada -->
           
    </main>
    <template id="event-card-template">
        <div class=" event-card card border-0 rounded-4 shadow-sm p-3 mb-2 bg-white border-start border-4 border-primary ">
            <div class="d-flex justify-content-between align-items-center mb-1">
                <span class="text-uppercase text-primary small fw-bold event-date"></span>
            </div>
            <h4 class="h5 fw-bold text-dark mb-2 event-title"></h4>
            <p class="mb-1 small text-secondary"><strong>Hora:</strong> <span class="event-hour"></span></p>
            <p class="mb-1 small text-secondary"><strong>Lugar:</strong> <span class="event-place"></span></p>
            <p class="text-muted small mb-2 event-note"></p>
            <button class="btn btn-danger btn-sm btn-delete align-self-end">Eliminar</button>
        </div>
    </template>

    <div class="modal fade" id="eventDetailsModal" tabindex="-1" aria-labelledby="eventDetailsModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <h2 class="modal-title fs-5" id="eventDetailsModalLabel">Detalles del evento</h2>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
                </div>
                <div class="modal-body" id="event-details"></div>
            </div>
        </div>
    </div>

    <div class="modal fade" id="eventModal" tabindex="-1" aria-labelledby="eventModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <h2 class="modal-title fs-5" id="eventModalLabel">Agregar evento</h2>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
                </div>
                <div class="modal-body">
                    <span class="text-uppercase text-purple small fw-bold">Nuevo recordatorio</span>
                    <form id="event-form" class="mt-3" novalidate>
                        <div class="mb-3">
                            <label for="title" class="form-label fw-bold small text-secondary">Título</label>
                            <input type="text" class="form-control border-light-subtle rounded-3 bg-light" id="title" placeholder="Reunión con el equipo" aria-describedby="title-error" required>
                            <div class="error-message" id="title-error" aria-live="polite"></div>
                        </div>
                        <div class="mb-3">
                            <label for="date" class="form-label fw-bold small text-secondary">Fecha</label>
                            <input type="date" class="form-control border-light-subtle rounded-3 bg-light" id="date" aria-describedby="date-error" required>
                            <div class="error-message" id="date-error" aria-live="polite"></div>
                        </div>
                        <div class="mb-3">
                            <label for="hour" class="form-label fw-bold small text-secondary">Hora</label>
                            <input type="time" class="form-control border-light-subtle rounded-3 bg-light" id="hour" aria-describedby="hour-error" >
                            <div class="error-message" id="hour-error" aria-live="polite"></div>
                        </div>
                        <div class="mb-3">
                            <label for="place" class="form-label fw-bold small text-secondary">Lugar</label>
                            <input type="text" class="form-control border-light-subtle rounded-3 bg-light" id="place" placeholder="Teatro">
                        </div>
                        <div class="mb-3">
                            <label for="note" class="form-label fw-bold small text-secondary">Nota</label>
                            <textarea class="form-control border-light-subtle rounded-3 bg-light" id="note" rows="3" placeholder="Añade los detalles importantes"></textarea>
                        </div>
                        <button type="submit" class="btn btn-primary">Guardar evento</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
    <!-- STANDARD JS -->
    <script src="https://cdn.jsdelivr.net/npm/fullcalendar@7.1.3/all/global.js"></script>
    <!-- THEME JS -->
    <script src="https://cdn.jsdelivr.net/npm/fullcalendar@7.1.3/themes/monarch/global.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/fullcalendar@7.1.3/locales-all/global.js"></script>
    <script src="./static/js/calendar.js"></script>
</body>
</html>
